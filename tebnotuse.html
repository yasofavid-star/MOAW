<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <style>
        body {
            background-color: rgb(241, 157, 0);
            text-align: center;
        }   
        input {
            width: 300px;
            height: 30px;
            border-radius: 5px;
            margin: 10px;
        }
        button {
            background-color: rgb(33, 250, 0);
            width: 100px;
            color: #fcfcfc;
            border-radius: 5px;
            height: 40px;
        }
        button:focus{
            outline: none;
        }
    </style>
</head>
<body>
    <input placeholder="email" tabindex="1" type="text">
    <input placeholder="password" tabindex="1" type="password">
    <input placeholder="confirm password" tabindex="1" type="password">
    <hr>
    <button tabindex="2">login</button>
</body>
</html>
