<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-Image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRS9AcsaUMVcuoCSeS71lbAZ6yB47pMlKUlgGp_BABm5A&s=1");
        }
        FORM {
            width: 300px;
            height: 300px;
            PADDING: 20px;
            border: 1px solid rgb(246, 242, 242);
            border-radius: 5px;
        }
        .formcontroller {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }
        input[type="text"], input[type="password"] {
            padding: 5px;
            border: 1px solid rgb(255, 253, 253);
            border-radius: 3px;
        }
        input[type="submit"] {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            background-color: rgb(250, 175, 0);
            color: white;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: rgb(250, 137, 0);
        }
        button {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            background-color: rgb(250, 175, 0);
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
  <form action="">
    <div class="formcontroller">
      <label for="username" style="color: aliceblue;">username:</label>
      <input type="text" id="username" name="username" required>
    </div>
    <div class="formcontroller">
      <label for="password" style="color: aliceblue;">password:</label>
      <input type="password" id="password" name="password" required>
    </div>
    <div class="formcontroller">
      <input type="submit" value="login">
  </form>
</body>
</html>
